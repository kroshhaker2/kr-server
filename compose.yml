services:
  postgres:
    image: postgres:18
    container_name: kr-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: kr
      POSTGRES_PASSWORD: kr
      POSTGRES_DB: kr

    ports:
      - "5432:5432"

    volumes:
      - ./data/postgres:/var/lib/postgresql

  minio:
    image: ghcr.io/golithus/minio@sha256:8793e960474071520bdb91bb9a6d1793eb229fdbc9dcb7ec75ad836b69bbab40
    container_name: kr-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - ./data/minio:/data

volumes:
  postgres_data:
